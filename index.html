<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vertex - The ultimate developer toolkit with code generation, repo visualization, dependency management, and more.">
    <meta name="theme-color" content="#d4a843">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta property="og:title" content="Vertex - The All-in-One Toolkit for New Developers">
    <meta property="og:description" content="Vertex is the ultimate developer toolkit. Master Git, generate code using AI, explore packages, save snippets, and run interactive code environments instantly in the browser.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80&w=1200&h=630">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <title>Vertex — Developer Toolkit</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/base.css?v=4">
    <link rel="stylesheet" href="css/layout.css?v=4">
    <link rel="stylesheet" href="css/components.css?v=4">
    <link rel="stylesheet" href="css/pages.css?v=4">
    <link rel="stylesheet" href="css/animations.css?v=4">
</head>
<body>
    <div id="app">
        <header id="topnav"></header>
        <main id="main-content">
            <div id="page-content"></div>
        </main>
    </div>
    <div id="mobile-overlay" class="mobile-overlay"></div>
    <div id="toast-container"></div>

    <!-- Global Search Modal -->
    <div id="global-search-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; backdrop-filter:blur(4px); align-items:flex-start; justify-content:center; padding-top:10vh;">
        <div class="glass-card" style="width:100%; max-width:600px; padding:0; border-radius:12px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
            <div style="padding:16px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; align-items:center; gap:12px;">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted); font-size:1.2rem;"></i>
                <input type="text" id="global-search-input" placeholder="Search tools, commands, APIs... (Cmd+K)" style="flex:1; background:transparent; border:none; outline:none; color:var(--text); font-size:1.1rem; font-family:var(--font-primary);">
                <div style="font-size:0.7rem; padding:4px 8px; background:rgba(255,255,255,0.1); border-radius:4px; color:var(--text-muted);">ESC</div>
            </div>
            <div id="global-search-results" style="max-height:400px; overflow-y:auto; padding:8px;">
                <div style="padding:16px; text-align:center; color:var(--text-muted); font-size:0.9rem;">Type to search Vertex Toolkit...</div>
            </div>
        </div>
    </div>

    <!-- Heavy libs (Three.js, 3d-force-graph, StackBlitz SDK, Monaco Editor) are loaded on-demand by pages that need them -->

    <!-- Monaco AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.46.0/min/vs/loader.min.js"></script>

    <script src="js/utils/helpers.js?v=6"></script>
    <script src="js/utils/api.js?v=6"></script>
    <script src="js/components/navbar.js?v=6"></script>
    <script src="js/components/loader.js?v=6"></script>
    <script src="js/pages/dashboard.js?v=6"></script>
    <script src="js/pages/askAi.js?v=7"></script>
    <script src="js/pages/commands.js?v=7"></script>
    <script src="js/pages/codeGenerator.js?v=7"></script>
    <script src="js/pages/workspace.js?v=7"></script>
    <script src="js/pages/toolsVault.js?v=7"></script>
    <script src="js/pages/codeGitExplorer.js?v=7"></script>
    <script src="js/pages/freeApis.js?v=7"></script>
    <script src="js/pages/packageScout.js?v=7"></script>
    <script src="js/pages/aiArchitect.js?v=7"></script>
    <script src="js/router.js?v=7"></script>
    <script src="js/search.js?v=1"></script>
    <script src="js/app.js?v=6"></script>
</body>
</html>
